services:
  - type: web
    name: workez-api
    plan: free
    runtime: docker
    rootDir: WorkEzApi
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Segredos: defina os valores no painel do Render (sync: false não os versiona).
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SecretKey
        sync: false
      - key: DelFinance__ApiKey
        sync: false
      - key: DelFinance__AccountId
        sync: false
      - key: DelFinance__WebhookSecret
        sync: false
      - key: Jwt__Issuer
        value: WorkEz
      - key: Jwt__Audience
        value: WorkEzClient
      - key: Jwt__AccessTokenExpirationMinutes
        value: "15"
      - key: Jwt__RefreshTokenExpirationDays
        value: "7"
      - key: DelFinance__BaseUrl
        value: "https://apisandbox.delbank.com.br"
      - key: Smtp__Host
        value: "smtp-relay.brevo.com"
      - key: Smtp__Port
        value: "587"
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromEmail
        value: "no.reply.workez@gmail.com"
      - key: Smtp__FromName
        value: "WorkEz Plataforma"
      - key: Smtp__EnableSsl
        value: "true"

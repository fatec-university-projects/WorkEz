services:
  - type: web
    name: workez-api
    plan: free
    runtime: docker
    rootDir: WorkEzApi
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Segredos: defina os valores no painel do Render (sync: false não os versiona).
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SecretKey
        sync: false
      - key: AbacatePay__ApiKey
        sync: false
      - key: AbacatePay__WebhookSecret
        sync: false
      - key: Jwt__Issuer
        value: WorkEz
      - key: Jwt__Audience
        value: WorkEzClient
      - key: Jwt__AccessTokenExpirationMinutes
        value: "15"
      - key: Jwt__RefreshTokenExpirationDays
        value: "7"
      - key: AbacatePay__BaseUrl
        value: "https://api.abacatepay.com/v1"
